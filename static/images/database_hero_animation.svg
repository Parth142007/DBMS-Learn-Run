<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="200" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Cylinder Gradients -->
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="dbCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>

  <style>
    @keyframes flowLine {
      from { stroke-dashoffset: 60; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.05); }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes blinkDot {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .flow-path {
      stroke-dasharray: 8 6;
      animation: flowLine 2s linear infinite;
    }
    .floating-box {
      animation: floatNode 4s ease-in-out infinite;
    }
    .status-dot {
      animation: blinkDot 1.4s ease-in-out infinite;
    }
    .pulse-halo {
      transform-origin: center;
      animation: pulseGlow 3s ease-in-out infinite;
    }
  </style>

  <!-- Container Box with Border Glow -->
  <rect x="2" y="2" width="876" height="196" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Grid Pattern in Background -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="200" />
    <line x1="120" y1="0" x2="120" y2="200" />
    <line x1="200" y1="0" x2="200" y2="200" />
    <line x1="280" y1="0" x2="280" y2="200" />
    <line x1="360" y1="0" x2="360" y2="200" />
    <line x1="440" y1="0" x2="440" y2="200" />
    <line x1="520" y1="0" x2="520" y2="200" />
    <line x1="600" y1="0" x2="600" y2="200" />
    <line x1="680" y1="0" x2="680" y2="200" />
    <line x1="760" y1="0" x2="760" y2="200" />
    <line x1="840" y1="0" x2="840" y2="200" />
    <line x1="0" y1="40" x2="880" y2="40" />
    <line x1="0" y1="100" x2="880" y2="100" />
    <line x1="0" y1="160" x2="880" y2="160" />
  </g>

  <!-- Ambient background glow spots -->
  <circle cx="210" cy="100" r="70" fill="#0ea5e9" opacity="0.12" filter="url(#cyanGlow)" />
  <circle cx="440" cy="100" r="80" fill="#10b981" opacity="0.10" filter="url(#emeraldGlow)" />
  <circle cx="680" cy="95" r="75" fill="#6366f1" opacity="0.12" filter="url(#purpleGlow)" />

  <!-- Connecting Bus Lines with Animated Packets -->
  <!-- Line 1: Frontend Client to Query Engine -->
  <path d="M 180 100 L 290 100" stroke="#0ea5e9" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 180 100 L 290 100" stroke="#38bdf8" stroke-width="2.5" fill="none" class="flow-path" />

  <!-- Line 2: Query Engine to MySQL Storage -->
  <path d="M 430 100 L 530 100" stroke="#10b981" stroke-width="2.5" fill="none" opacity="0.7" />
  <path d="M 430 100 L 530 100" stroke="#34d399" stroke-width="2.5" fill="none" class="flow-path" />

  <!-- Line 3: Branch to AI Advisory Node -->
  <path d="M 360 62 C 360 38, 680 38, 680 62" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" fill="none" opacity="0.6" />
  <path d="M 360 62 C 360 38, 680 38, 680 62" stroke="#c084fc" stroke-width="2" fill="none" class="flow-path" />

  <!-- ==================== LEFT NODE: CLIENT / BROWSER ==================== -->
  <g transform="translate(45, 45)" class="floating-box">
    <!-- Outer glass card -->
    <rect x="0" y="0" width="135" height="110" rx="10" fill="#0f172a" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="135" height="24" rx="10" fill="#1e293b" fill-opacity="0.7" />
    
    <!-- Mini window dots -->
    <circle cx="12" cy="12" r="3.5" fill="#ef4444" />
    <circle cx="22" cy="12" r="3.5" fill="#f59e0b" />
    <circle cx="32" cy="12" r="3.5" fill="#10b981" />
    <text x="44" y="15" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600">CLIENT APP</text>

    <!-- Browser Content -->
    <text x="14" y="48" fill="#38bdf8" font-family="'Fira Code', monospace, sans-serif" font-size="11" font-weight="700">SQL Lab UI</text>
    <text x="14" y="66" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10">Flask &amp; Jinja2</text>
    <text x="14" y="82" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5">Vanilla JS &amp; BS5</text>
    
    <!-- Active Status Pill -->
    <rect x="14" y="90" width="107" height="14" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#0ea5e9" stroke-width="0.8" />
    <circle cx="22" cy="97" r="3" fill="#38bdf8" class="status-dot" />
    <text x="29" y="100.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600">INTERACTIVE UI</text>
  </g>

  <!-- ==================== MIDDLE NODE: EXECUTION ENGINE ==================== -->
  <g transform="translate(290, 42)">
    <!-- Central Glass Card -->
    <rect x="0" y="0" width="145" height="116" rx="12" fill="#0f172a" fill-opacity="0.95" stroke="#10b981" stroke-width="1.8" filter="url(#emeraldGlow)" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="145" height="26" rx="12" fill="#064e3b" fill-opacity="0.6" />
    <text x="12" y="17" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700">CORE DBMS ENGINE</text>
    
    <!-- Sub-components -->
    <rect x="10" y="34" width="125" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="48" fill="#a7f3d0" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">Query Processor</text>

    <rect x="10" y="58" width="125" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="72" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">2PL &amp; WAL Engine</text>

    <rect x="10" y="82" width="125" height="20" rx="5" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
    <text x="18" y="96" fill="#fbcfe8" font-family="'Fira Code', monospace" font-size="9.5" font-weight="600">Relational Algebra</text>

    <circle cx="132" cy="13" r="3.5" fill="#10b981" class="status-dot" />
  </g>

  <!-- ==================== RIGHT NODE: MYSQL 8.0 CLUSTER ==================== -->
  <g transform="translate(530, 40)" class="floating-box">
    <!-- Outer Storage Pod -->
    <rect x="0" y="0" width="125" height="120" rx="12" fill="#0f172a" fill-opacity="0.9" stroke="#0ea5e9" stroke-width="1.5" />
    <text x="12" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">MySQL 8.0 INNODB</text>
    
    <!-- 3D Database Cylinder Stack -->
    <!-- Disk 3 (Bottom) -->
    <g transform="translate(18, 86)">
      <path d="M 0 6 A 44 11 0 0 0 88 6 L 88 18 A 44 11 0 0 1 0 18 Z" fill="url(#dbGrad)" />
      <ellipse cx="44" cy="6" rx="44" ry="10" fill="url(#dbCap)" />
      <line x1="2" y1="12" x2="86" y2="12" stroke="#7dd3fc" stroke-width="0.7" opacity="0.6" />
    </g>

    <!-- Disk 2 (Middle) -->
    <g transform="translate(18, 64)">
      <path d="M 0 6 A 44 11 0 0 0 88 6 L 88 18 A 44 11 0 0 1 0 18 Z" fill="url(#dbGrad)" />
      <ellipse cx="44" cy="6" rx="44" ry="10" fill="url(#dbCap)" />
      <line x1="2" y1="12" x2="86" y2="12" stroke="#7dd3fc" stroke-width="0.7" opacity="0.6" />
    </g>

    <!-- Disk 1 (Top) -->
    <g transform="translate(18, 42)">
      <path d="M 0 6 A 44 11 0 0 0 88 6 L 88 18 A 44 11 0 0 1 0 18 Z" fill="url(#dbGrad)" />
      <ellipse cx="44" cy="6" rx="44" ry="10" fill="url(#dbCap)" />
      <line x1="2" y1="12" x2="86" y2="12" stroke="#7dd3fc" stroke-width="0.7" opacity="0.6" />
      <circle cx="44" cy="6" r="3" fill="#ffffff" opacity="0.8" />
    </g>

    <text x="20" y="114" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="8.5" font-weight="600">8 Curated Tables</text>
  </g>

  <!-- ==================== FAR RIGHT NODE: GEMINI AI ADVISOR ==================== -->
  <g transform="translate(710, 48)">
    <rect x="0" y="0" width="135" height="104" rx="10" fill="#1e1b4b" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5" filter="url(#purpleGlow)" />
    
    <!-- AI Sparkle Icon -->
    <g transform="translate(14, 14)">
      <path d="M 8 0 L 10 5 L 15 7 L 10 9 L 8 14 L 6 9 L 1 7 L 6 5 Z" fill="url(#geminiGrad)" />
      <circle cx="16" cy="3" r="1.5" fill="#f472b6" />
    </g>
    <text x="36" y="24" fill="#e9d5ff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700">GEMINI 2.5</text>
    
    <text x="14" y="48" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">AI SQL ADVISORY</text>
    <text x="14" y="64" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">• SQL Error Diagnosis</text>
    <text x="14" y="78" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">• Query Optimization</text>
    <text x="14" y="92" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5">• Plain-English Explains</text>
  </g>

  <!-- Bottom Interactive Capability Pills -->
  <g transform="translate(50, 168)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="10" cy="11" r="3.5" fill="#10b981" />
    <text x="19" y="14.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">7 Curriculum Phases</text>

    <!-- Pill 2 -->
    <rect x="150" y="0" width="145" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="160" cy="11" r="3.5" fill="#0ea5e9" />
    <text x="169" y="14.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">Visual ER Diagrammer</text>

    <!-- Pill 3 -->
    <rect x="305" y="0" width="150" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="315" cy="11" r="3.5" fill="#f59e0b" />
    <text x="324" y="14.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">1NF to BCNF Normalizer</text>

    <!-- Pill 4 -->
    <rect x="465" y="0" width="145" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="475" cy="11" r="3.5" fill="#a855f7" />
    <text x="484" y="14.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">Transactions &amp; 2PL</text>

    <!-- Pill 5 -->
    <rect x="620" y="0" width="160" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="630" cy="11" r="3.5" fill="#ec4899" />
    <text x="639" y="14.5" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">110/110 Automated Tests</text>
  </g>
</svg>
